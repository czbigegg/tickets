:root{--bg:#07070f;--panel:rgba(18,16,34,.78);--panel2:#1a1830;--line:rgba(255,255,255,.08);--txt:#eeeef8;--mut:#9a98b6;--gold:#f6c24b;--orange:#ff8a1a;--purple:#7b2cff;
--compra:#2fbf71;--creador:#5865f2;--soporte:#a06bff;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:500 14.5px/1.5 "Pop","Segoe UI",system-ui,sans-serif;overflow:hidden}
b,strong,h1,h2{font-weight:700}
/* ---------- fondo animado ---------- */
#fondo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
 background:radial-gradient(ellipse 80% 60% at 50% 35%,#2b1a58 0%,#120c2a 45%,#07070f 80%)}
#fondo .rays{position:absolute;left:50%;top:38%;width:2200px;height:2200px;margin:-1100px 0 0 -1100px;opacity:.55;
 background:repeating-conic-gradient(from 0deg,rgba(255,190,80,.13) 0 5deg,transparent 5deg 15deg);
 -webkit-mask:radial-gradient(circle,#000 5%,transparent 45%);mask:radial-gradient(circle,#000 5%,transparent 45%);animation:gira 60s linear infinite}
#fondo .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:flota 14s ease-in-out infinite alternate}
.p{position:absolute;bottom:-20px;border-radius:50%;background:#ffd27a;box-shadow:0 0 10px #ffb347;animation:sube linear infinite}
body.dentro #fondo .rays{opacity:.18;top:0}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes flota{to{transform:translate(60px,-40px) scale(1.15)}}
@keyframes sube{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:.8}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
/* ---------- login ---------- */
#login{position:relative;z-index:2;height:100%;display:grid;place-items:center;transition:opacity .6s,transform .6s var(--ease)}
#login.sale{opacity:0;transform:scale(1.08);pointer-events:none}
.caja{position:relative;width:min(400px,92vw);padding:30px 30px 26px;text-align:center;border-radius:26px;
 background:rgba(14,12,28,.82);backdrop-filter:blur(14px);box-shadow:0 40px 100px rgba(0,0,0,.7);animation:entra .9s var(--ease) both}
.caja::before{content:"";position:absolute;inset:-2px;border-radius:28px;padding:2px;z-index:-1;
 background:conic-gradient(from var(--a,0deg),#ffd27a,#ff7a18,#7b2cff,#ff7a18,#ffd27a);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borde 5s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes borde{to{--a:360deg}}
@keyframes entra{from{opacity:0;transform:translateY(40px) scale(.94)}}
.logo{position:relative;width:150px;height:150px;margin:-4px auto 6px}
.logo img{position:relative;width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(255,150,0,.6))}
.logo::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(246,194,75,.35);animation:gira 18s linear infinite}
.logo::after{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,40,.55),transparent 65%);animation:pulso 2.4s ease-in-out infinite;z-index:-1}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes pulso{50%{transform:scale(1.25);opacity:.5}}
.titulo{font:700 40px/1 "Pop",sans-serif;letter-spacing:1px;margin:8px 0 0;
 background:linear-gradient(100deg,#fff6d6 0%,#ffc94a 30%,#ff8a1a 50%,#ffc94a 70%,#fff6d6 100%);background-size:250% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 4s linear infinite;filter:drop-shadow(0 4px 0 #6a2e00)}
@keyframes brillo{to{background-position:-250% 0}}
.marca{font:700 15px "Pop";letter-spacing:6px;color:#cdb8ff;margin-top:6px}
.info{color:var(--mut);margin:14px 0 18px;font-size:12.5px}
.campo{position:relative}
.campo input{width:100%;padding:14px 46px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.45);color:var(--txt);
 font:600 16px "Pop";text-align:center;letter-spacing:2px;outline:none;transition:border-color .25s,box-shadow .25s}
.campo input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(246,194,75,.18),0 0 30px rgba(246,194,75,.15)}
.campo span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px}
.btn{position:relative;overflow:hidden;width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;font:700 16px "Pop";letter-spacing:1px;cursor:pointer;color:#2a1600;
 background:linear-gradient(#ffd27a,#ff9a1a);box-shadow:0 10px 30px rgba(255,140,0,.35);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(255,140,0,.5)}.btn:active{transform:scale(.98)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:barrido 2.8s ease-in-out infinite}
@keyframes barrido{60%,100%{left:130%}}
.btn:disabled{cursor:wait;filter:saturate(.6)}
.btn .rueda{display:none;width:18px;height:18px;border:3px solid rgba(42,22,0,.3);border-top-color:#2a1600;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:gira .7s linear infinite}
.btn:disabled .rueda{display:inline-block}
#err{color:#ff6b6b;min-height:22px;margin-top:10px;font-size:13.5px}
.tiembla{animation:tiembla .45s}
@keyframes tiembla{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pie{color:var(--mut);font-size:11.5px;margin-top:8px;opacity:.8}
/* ---------- app ---------- */
#app{position:relative;z-index:2;display:none;height:100%;flex-direction:column}
#app.ok{display:flex;animation:aparece .7s var(--ease) both}
@keyframes aparece{from{opacity:0;transform:translateY(20px)}}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(10,8,22,.75);backdrop-filter:blur(12px)}
header img{width:50px;height:50px;filter:drop-shadow(0 4px 14px rgba(255,150,0,.5));animation:giro-in 1s var(--ease) both}
@keyframes giro-in{from{transform:rotate(-200deg) scale(0)}}
.ht{line-height:1.05}.ht h1{margin:0;font-size:22px;letter-spacing:1px;background:linear-gradient(100deg,#fff6d6,#ffc94a 40%,#ff8a1a 55%,#ffc94a 70%,#fff6d6);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 5s linear infinite}
.ht small{font:700 11px "Pop";letter-spacing:4px;color:#cdb8ff}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12.5px;color:var(--mut);animation:aparece .6s var(--ease) both}
.stat b{color:var(--txt);font-size:16px;margin-right:5px}
#quien{color:var(--gold);border-color:rgba(246,194,75,.3)}
.salir{background:none;border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:7px 14px;cursor:pointer;font:600 13px "Pop";transition:.2s}
.salir:hover{color:#fff;border-color:#ff6b6b;background:rgba(255,80,80,.12)}
.mod .chip[data-k=compra],.mod .stats .stat:nth-child(2),.mod .stats .stat:nth-child(3){display:none}
#main{flex:1;display:flex;min-height:0}
aside{width:370px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(10px)}
.busca{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.busca input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--txt);font:500 14px "Pop";outline:none;transition:.25s}
.busca input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,194,75,.15)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--mut);cursor:pointer;font-size:12.5px;user-select:none;transition:.25s var(--ease)}
.chip:hover{color:#fff;transform:translateY(-1px)}
.chip.on{background:linear-gradient(#ffd27a,#ff9a1a);color:#2a1600;border-color:transparent;font-weight:700;box-shadow:0 4px 16px rgba(255,140,0,.35)}
#lista{overflow:auto;flex:1;padding:6px}
.item{display:flex;gap:11px;padding:11px;margin:4px 2px;border-radius:14px;cursor:pointer;border:1px solid transparent;position:relative;
 transition:background .25s,transform .25s var(--ease),border-color .25s;animation:desliza .5s var(--ease) both}
@keyframes desliza{from{opacity:0;transform:translateX(-24px)}}
.item:hover{background:rgba(255,255,255,.05);transform:translateX(4px)}
.item.sel{background:linear-gradient(90deg,rgba(246,194,75,.16),rgba(123,44,255,.08));border-color:rgba(246,194,75,.35)}
.item.sel::before{content:"";position:absolute;left:-2px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.item img{width:40px;height:40px;border-radius:50%;flex:none;background:#222;border:2px solid rgba(255,255,255,.08)}
.item .t{font-weight:700}.item .m{font-size:11.5px;color:var(--mut)}
.badge{display:inline-block;font:700 10.5px "Pop";padding:2px 8px;border-radius:10px;margin-left:6px;color:#fff;vertical-align:1px}
.b-compra{background:var(--compra)}.b-creador{background:var(--creador)}.b-soporte{background:var(--soporte)}.b-otro{background:#555}
.plan{display:inline-block;font:700 10.5px "Pop";padding:2px 8px;border-radius:10px;background:rgba(246,194,75,.14);color:var(--gold);margin-top:4px;border:1px solid rgba(246,194,75,.25)}
section{flex:1;overflow:auto;padding:0 0 30px;background:rgba(7,7,15,.55)}
.vacio{height:100%;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px}
.vacio .huevo{font-size:64px;animation:bob 2.6s ease-in-out infinite;display:inline-block}
.cab{position:sticky;top:0;background:rgba(10,8,22,.9);backdrop-filter:blur(12px);padding:16px 24px;border-bottom:1px solid var(--line);z-index:2;animation:aparece .45s var(--ease) both}
.cab h2{margin:0 0 4px;font-size:18px}.cab .m{color:var(--mut);font-size:12.5px}.cab .m b{color:var(--txt)}
.msg{display:flex;gap:14px;padding:9px 24px;transition:background .2s;animation:sube-msg .45s var(--ease) both}
@keyframes sube-msg{from{opacity:0;transform:translateY(14px)}}
.msg:hover{background:rgba(255,255,255,.03)}
.msg img.av{width:40px;height:40px;border-radius:50%;flex:none;margin-top:2px;background:#222}
.msg .n{font-weight:700}.msg .n .bot{font:700 9.5px "Pop";background:#5865f2;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.msg .h{color:var(--mut);font-size:11.5px;margin-left:8px}
.txt{white-space:pre-wrap;word-wrap:break-word}
.emb{margin-top:6px;max-width:560px;background:rgba(26,24,48,.9);border-left:4px solid var(--gold);border-radius:8px;padding:11px 15px}
.emb .et{font-weight:700;margin-bottom:4px}.emb .ef{margin-top:8px}.emb .efn{font-weight:700;font-size:13.5px}
.emb .ft{margin-top:8px;font-size:11.5px;color:var(--mut)}.emb img.im{max-width:100%;border-radius:6px;margin-top:8px}
.adj img{max-width:380px;max-height:380px;border-radius:10px;margin-top:6px;display:block;cursor:zoom-in;transition:transform .25s var(--ease),box-shadow .25s}
.adj img:hover{transform:scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.adj a{color:#7ab7ff}
code{background:#000;padding:1px 5px;border-radius:5px}pre{background:#000;padding:9px;border-radius:8px;white-space:pre-wrap;margin:4px 0}
.men{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:4px;padding:0 3px}
img.emo{width:22px;height:22px;vertical-align:-5px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:9;cursor:zoom-out}
#zoom.on{display:grid;animation:aparece .3s both}
#zoom img{max-width:94vw;max-height:94vh;border-radius:10px}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
.volver{display:none}
@media(max-width:800px){aside{width:100%}#main.ver aside{display:none}#main:not(.ver) section{display:none}
 .volver{display:inline-block;margin-bottom:8px;color:var(--gold);cursor:pointer}.titulo{font-size:32px}
 header{padding:10px 14px;gap:10px}header img{width:40px;height:40px}.ht h1{font-size:18px}.ht small{font-size:9.5px;letter-spacing:3px}
 .stats{display:none}#quien{margin-left:auto;font-size:11px;padding:5px 9px;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis}.salir{padding:6px 10px;font-size:12px}
 .msg{padding:9px 14px;gap:10px}.msg img.av{width:34px;height:34px}.cab{padding:12px 14px}.adj img{max-width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
const ITER=150000;let T=[],filtro='todos',sel=null;
const $=id=>document.getElementById(id);
const LOGO=document.querySelector('link[rel=icon]').href;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
(()=>{const f=$('fondo');for(let i=0;i<38;i++){const p=document.createElement('i');p.className='p';const z=2+Math.random()*4;
 Object.assign(p.style,{left:Math.random()*100+'%',width:z+'px',height:z+'px',animationDuration:9+Math.random()*12+'s',animationDelay:-Math.random()*20+'s',
 background:Math.random()<.25?'#b78cff':'#ffd27a',opacity:.8});f.appendChild(p)}})();
$('f').onsubmit=async ev=>{ev.preventDefault();$('err').textContent='';$('go').disabled=true;$('gotxt').textContent='ABRIENDO…';
 try{let k=null,quien='',nivel=0;const pw=new TextEncoder().encode($('pw').value);
  const base=await crypto.subtle.importKey('raw',pw,'PBKDF2',false,['deriveKey']);
  for(const L of LLAVES){const r=b64(L);try{
    const kk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:r.slice(0,16),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const p=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(16,28)},kk,r.slice(28)));
    nivel=p[0];k=p.slice(1,33);quien=new TextDecoder().decode(p.slice(33));break}catch(_){}}
  if(!k)throw 0;
  const raw=b64(BLOBS[nivel]);if(nivel)document.body.classList.add('mod');
  const dk=await crypto.subtle.importKey('raw',k,'AES-GCM',false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},dk,raw.slice(12));
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  T=JSON.parse(txt).tickets;T.forEach(t=>{const m=/^usuario (\d+)$/.exec(t.cliente||'');if(m&&t.usuarios&&t.usuarios[m[1]])t.cliente=t.usuarios[m[1]]});$('quien').textContent=quien?'👤 '+quien:'';
  $('gotxt').textContent='✔ BIENVENIDO';$('login').classList.add('sale');
  setTimeout(()=>{$('login').style.display='none';document.body.classList.add('dentro');$('app').classList.add('ok');stats();lista()},550);
 }catch(e){$('err').textContent='❌ Contraseña incorrecta';$('go').disabled=false;$('gotxt').textContent='ENTRAR';
  const c=$('f');c.classList.remove('tiembla');void c.offsetWidth;c.classList.add('tiembla');$('pw').select()}};
const E=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fecha=s=>s?new Date(s).toLocaleString('es-CL',{dateStyle:'medium',timeStyle:'short'}):'';
const tipos={compra:'🛒 Compra',creador:'🎥 Creador',soporte:'🛟 Soporte',otro:'Otro'};
function md(s,d){s=E(s);
 return s.replace(/```(?:\w*\n)?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/\|\|(.+?)\|\|/g,'$1')
  .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g,'$1<i>$2</i>')
  .replace(/^#{1,3} (.*)$/gm,'<b style="font-size:17px">$1</b>').replace(/^-# (.*)$/gm,'<span style="font-size:12px;color:var(--mut)">$1</span>')
  .replace(/&lt;a?:(\w+):(\d+)&gt;/g,'<img class="emo" src="https://cdn.discordapp.com/emojis/$2.png" alt=":$1:">')
  .replace(/&lt;@!?(\d+)&gt;/g,(m,i)=>`<span class="men">@${E((d.usuarios||{})[i]||'usuario')}</span>`)
  .replace(/&lt;@&amp;(\d+)&gt;/g,(m,i)=>`<span class="men">@${E((d.roles||{})[i]||'rol')}</span>`)
  .replace(/&lt;#(\d+)&gt;/g,(m,i)=>`<span class="men">#${E((d.canales||{})[i]||'canal')}</span>`)
  .replace(/&lt;t:(\d+)(:\w)?&gt;/g,(m,n)=>`<span class="men">${new Date(n*1000).toLocaleString('es-CL')}</span>`)
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank">$1</a>')}
function stats(){const c={};T.forEach(t=>c[t.tipo]=(c[t.tipo]||0)+1);const planes=T.filter(t=>t.plan).length;
 if(!$('stats').dataset.ok){$('stats').dataset.ok=1;$('stats').innerHTML=[[T.length,'tickets'],[planes,'con plan'],[c.compra||0,'compras'],[c.creador||0,'creadores'],[c.soporte||0,'soporte']].map((x,i)=>`<div class="stat" style="animation-delay:${.1+i*.08}s"><b data-n="${x[0]}">0</b>${x[1]}</div>`).join('');
  document.querySelectorAll('#stats b').forEach(b=>{const n=+b.dataset.n,t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/900);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
 $('chips').innerHTML=['todos','compra','creador','soporte'].map(k=>`<span class="chip ${filtro==k?'on':''}" data-k="${k}">${k=='todos'?'Todos':tipos[k]}</span>`).join('');
 document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filtro=ch.dataset.k;stats();lista()})}
function lista(){const q=$('q').value.toLowerCase();
 const L=T.filter(t=>(filtro=='todos'||t.tipo==filtro)&&(!q||[t.cliente,t.cliente_usuario,t.plan,t.canal,t.cerrado_por,...t.mensajes.map(m=>m.contenido)].join(' ').toLowerCase().includes(q)));
 const anim=!sel||lista._q!==q+filtro;lista._q=q+filtro;
 $('lista').innerHTML=L.map((t,i)=>`<div class="item ${sel==t.id?'sel':''}" data-id="${E(t.id)}" style="${anim?`animation-delay:${Math.min(i,15)*.04}s`:'animation:none'}">
 <img src="${E(t.cliente_avatar||LOGO)}" onerror="this.src=LOGO"><div><div class="t">${E(t.cliente)}<span class="badge b-${E(t.tipo)}">${tipos[t.tipo]||E(t.tipo)}</span></div>
 <div class="m">Cerrado ${fecha(t.cerrado)} · ${t.mensajes.length} mensajes</div>${t.plan?`<span class="plan">💰 ${E(t.plan)}</span>`:''}</div></div>`).join('')||'<div class="vacio" style="height:auto;padding:30px"><div><div class="huevo">🥚</div>No hay tickets</div></div>';
 document.querySelectorAll('.item').forEach(it=>it.onclick=()=>abrir(it.dataset.id))}
function abrir(id){sel=id;lista();$('main').classList.add('ver');const d=T.find(t=>t.id==id);
 let h=`<div class="cab"><span class="volver" onclick="$('main').classList.remove('ver')">← Volver</span><h2>#${E(d.canal)} <span class="badge b-${E(d.tipo)}">${tipos[d.tipo]||E(d.tipo)}</span></h2>
 <div class="m">👤 <b>${E(d.cliente)}</b>${d.cliente_usuario?` (${E(d.cliente_usuario)})`:''} · 📂 Abierto ${fecha(d.abierto)} · 🔒 Cerrado ${fecha(d.cerrado)} por <b>${E(d.cerrado_por)}</b>${d.plan?` · 💰 Plan: <b>${E(d.plan)}</b>`:''}</div></div>`;
 let mi=0;for(const m of d.mensajes){h+=`<div class="msg" style="animation-delay:${Math.min(mi++,20)*.035}s"><img class="av" src="${E(m.avatar)}" onerror="this.style.visibility='hidden'"><div style="min-width:0;flex:1">
 <span class="n">${E(m.autor)}${m.bot?'<span class="bot">BOT</span>':''}</span><span class="h">${fecha(m.fecha)}</span>${m.contenido?`<div class="txt">${md(m.contenido,d)}</div>`:''}`;
  for(const e of m.embeds){const col=e.color!=null?'#'+e.color.toString(16).padStart(6,'0'):'#f6c24b';
   h+=`<div class="emb" style="border-left-color:${col}">${e.title?`<div class="et">${md(e.title,d)}</div>`:''}${e.description?`<div class="txt">${md(e.description,d)}</div>`:''}
   ${(e.fields||[]).map(f=>`<div class="ef"><div class="efn">${md(f.name,d)}</div><div class="txt">${md(f.value,d)}</div></div>`).join('')}
   ${e.image?`<img class="im" src="${E(e.image)}" onerror="this.remove()">`:''}${e.footer?`<div class="ft">${E(e.footer)}</div>`:''}</div>`}
  if(m.adjuntos.length)h+='<div class="adj">'+m.adjuntos.map(a=>a.data?`<img src="${a.data}" class="z">`:`<a href="${E(a.url)}" target="_blank">📎 ${E(a.nombre)}</a>`).join('')+'</div>';
  h+='</div></div>'}
 $('ver').innerHTML=h;$('ver').scrollTop=0;
 document.querySelectorAll('img.z').forEach(i=>i.onclick=()=>{$('zoom').querySelector('img').src=i.src;$('zoom').classList.add('on')})}
$('q').oninput=lista;
</script></body></html>
